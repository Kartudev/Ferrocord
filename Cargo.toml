[package]
name = "ferrocord"
version = "0.21.8"
edition = "2024"
rust-version = "1.88"
description = "Lightweight native Discord desktop client (unofficial)"
license = "MIT"
repository = "https://github.com/FerroApps/Ferrocord"
publish = false
default-run = "ferrocord"

[features]
default = ["video", "web-login"]
# "Log in with Discord's page": the `ferrocord-login` helper shows
# discord.com/login in the system webview (WebView2 / WebKitGTK 4.1) so
# Discord can show its own captcha. Only the helper links the webview.
web-login = ["dep:wry", "dep:tao"]
# In-chat video playback: the `ferrocord-player` helper process decodes MP4 /
# QuickTime and WebM / Matroska with statically linked / pure-Rust decoders
# (H.264 8-bit, VP8, VP9, AAC, Opus) and, when the system has them, platform
# decoders opened at run time (system FFmpeg on Linux, Media Foundation on
# Windows) for H.265, AV1 and the rest; nothing extra is linked at build time.
# The main binary links none of them.
video = [
    "dep:openh264", "dep:symphonia", "dep:matroska-demuxer",
    "dep:rusty_vp9", "dep:vp8-decoder", "dep:libloading", "dep:windows",
]

[workspace]
members = [".", "crates/ferrocord-plugin-sdk"]
# The example plugins build for wasm32-unknown-unknown in their own workspace.
exclude = ["examples/plugins"]

[[bin]]
name = "ferrocord"
path = "src/main.rs"

[[bin]]
name = "ferrocord-player"
path = "src/bin/ferrocord-player/main.rs"
required-features = ["video"]

[[bin]]
name = "ferrocord-login"
path = "src/bin/ferrocord-login/main.rs"
required-features = ["web-login"]

[[test]]
name = "video_player"
required-features = ["video"]

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "advanced", "svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures = "0.3"
reqwest = { package = "reqwest-boring", version = "0.13.5", default-features = false, features = ["json", "boring", "http2", "stream", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4.2"
secrecy = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
directories = "6"
notify-rust = "4"
fastrand = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# Grapheme clusters, so keycaps, flags and ZWJ emoji are never split (already in the tree via iced).
unicode-segmentation = "1"
emojis = "0.9"
# Script type of cosmic-text's font fallback trait (Twemoji first); already in the tree via cosmic-text.
unicode-script = "0.5"
# System UI language for X-Discord-Locale / IDENTIFY (already in the tree via iced).
sys-locale = "0.3"
# IANA time zone for X-Discord-Timezone (already in the tree via chrono).
iana-time-zone = "0.1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
# Voice: Discord's mandatory audio/video E2EE (DAVE, MLS via OpenMLS), pure Rust.
davey = "0.2"
# Voice transport encryption modes Discord requires (aead_aes256_gcm_rtpsize,
# aead_xchacha20_poly1305_rtpsize); same `aead` 0.5 generation davey uses.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# Opus codec (Discord voice is Opus 48 kHz stereo; also the video helper's WebM audio).
opus = "0.3"
# Same crate opus uses; "static" links libopus.a so the binary needs no libopus package.
audiopus_sys = { version = "0.2", features = ["static"] }
# Microphone capture and speaker output (ALSA/PulseAudio/PipeWire via ALSA, WASAPI, CoreAudio);
# also the video helper's sound output.
cpal = "0.16"
# Plugins (`src/plugins/`): pure-Rust WebAssembly interpreter (no JIT, small,
# fuel-metered); the engine is created only when a plugin is enabled.
# `auto-dispatch` is required: without it debug builds use tail-call dispatch
# without the tail-call optimisation and a long wasm loop overflows the stack.
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
# ABI types shared with plugins (workspace member; no guest code).
ferrocord-plugin-sdk = { path = "crates/ferrocord-plugin-sdk", default-features = false }
# plugin.toml manifests (reuses the toml_parser already in the tree).
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# `.ferroplug` packages (zip, deflate through the flate2 already in the tree).
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

# Login helper (`ferrocord-login` only): Discord's login page in the OS
# webview (WebView2 on Windows, WebKitGTK 4.1 on Linux); the app links neither.
wry = { version = "0.57", optional = true }
# Window + event loop for the wry webview (wry's own windowing companion).
tao = { version = "0.37", optional = true }

# Video helper (`ferrocord-player` only; Linux and Windows). The app itself
# links none of these: they sit behind the `video` feature the helper requires.
# H.264 decoder: Cisco's BSD OpenH264, built from source and linked statically (Baseline/Main/High, B-frames).
openh264 = { version = "0.9", optional = true }
# Pure-Rust AAC decoder + MP4 audio demuxer.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"], optional = true }
# Pure-Rust WebM/Matroska demuxer (VP8/VP9 video and Opus audio tracks).
matroska-demuxer = { version = "0.8", optional = true }
# Pure-Rust VP9 decoder (Apache-2.0, no C, bit-exact against libvpx's conformance vectors).
rusty_vp9 = { version = "0.3", optional = true }
# Pure-Rust VP8 decoder (RFC 6386, conformance-tested on the WebM vectors).
vp8-decoder = { version = "0.1", optional = true }
# Opus, audiopus_sys (static libopus) and cpal are shared with voice (above).
# Platform decoders: opens the system FFmpeg (Linux) / mfplat.dll (Windows) at
# run time, so neither is a load-time dependency (already in the tree via wgpu).
libloading = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
# Registers the toast AppUserModelID (else toasts show as "PowerShell") and
# attaches `--version` / `--help` output to the parent console, opens links
# with ShellExecuteW (`app/opener.rs`); same version already in the tree via
# the notification backend.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Video helper only: Media Foundation decoder transforms (H.264, H.265, AV1, AAC)
# through COM; same version already in the tree (iced_winit, wry, tao).
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray (pure Rust over the zbus already in the tree).
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Renders the bundled SVG icon to ARGB pixmaps; already compiled for iced's svg.
resvg = { version = "0.45", default-features = false }
# In-app updater: reads the release tarball (`update::extract`, our own
# safe extraction on top of its header parser); no xattr support needed.
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# Fake voice gateway (MLS external sender) for the DAVE loopback test; same
# versions davey already compiles.
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
# Fake StatusNotifierWatcher for the tray integration test (same zbus as ksni).
zbus = "5"
tempfile = "3"
# Hostile test plugins written as WebAssembly text (sandbox tests).
wat = "1"
# Reads the bundled Twemoji's tables in tests (already in the tree via fontdb).
ttf-parser = "0.25"
# Encodes an APNG fixture in the animation tests (already compiled for `image`).
png = "0.18"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "time"] }
# Renders scenes with the software renderer iced already uses (ferroiced's
# iced_tiny_skia and its tiny-skia, both already in the tree) to compare
# partial and full redraws pixel by pixel.
iced_tiny_skia = { version = "0.14", default-features = false, features = ["image"] }
tiny-skia = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# RSA key generation (QR login) is unusably slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# iced comes from ferroiced (https://github.com/Kartudev/ferroiced): iced 0.14.1
# plus a tiny-skia fast path for opaque images (video frames, GIFs). Crate
# names are unchanged, so every iced crate in the graph must be patched to
# the same source, or two copies of iced_graphics get mixed.
[patch.crates-io]
iced = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_core = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_debug = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_futures = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_graphics = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_program = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_renderer = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_runtime = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_tiny_skia = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_wgpu = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_widget = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
iced_winit = { git = "https://github.com/Kartudev/ferroiced", branch = "main" }
