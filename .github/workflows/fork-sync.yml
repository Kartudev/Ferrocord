name: Fork sync

# Fork only. Keeps main and development equal to upstream (fast-forward
# only: a branch that has diverged is reported, never merged or forced) and
# keeps upstream's release automation (version.yml / release.yml) disabled
# here, so syncing never bumps versions or publishes "official" releases
# from the fork. Feature branches are never touched.
#
# Secret SYNC_TOKEN (fine-grained PAT on this repo: Contents + Workflows
# read/write) is needed whenever upstream changes files under
# .github/workflows: GITHUB_TOKEN may not push those.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: FerroApps/Ferrocord
  BRANCHES: main development

jobs:
  sync:
    if: github.repository != 'FerroApps/Ferrocord'
    runs-on: ubuntu-latest
    steps:
      - name: Keep upstream release automation off in the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in version.yml release.yml; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state 2>/dev/null || echo missing)"
            if [ "$state" = "active" ]; then
              gh workflow disable "$wf" -R "$GITHUB_REPOSITORY"
              echo "Disabled $wf"
            fi
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fast-forward main and development
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM.git"
          failed=0
          for b in $BRANCHES; do
            git fetch -q --no-tags upstream "$b"
            up="$(git rev-parse FETCH_HEAD)"
            if ! git fetch -q --no-tags origin "$b"; then
              echo "::warning::origin/$b missing, creating it"
              git push origin "$up:refs/heads/$b" || failed=1
              continue
            fi
            mine="$(git rev-parse FETCH_HEAD)"
            if [ "$up" = "$mine" ] || git merge-base --is-ancestor "$up" "$mine"; then
              echo "$b: up to date"
            elif git merge-base --is-ancestor "$mine" "$up"; then
              echo "$b: fast-forward ${mine:0:7} -> ${up:0:7}"
              if ! git push origin "$up:refs/heads/$b"; then
                echo "::error::push to $b failed (if upstream touched .github/workflows, add the SYNC_TOKEN secret)"
                failed=1
              fi
            else
              echo "::warning::$b has diverged from upstream; not touched (fix it by hand)"
              failed=1
            fi
          done
          exit "$failed"
